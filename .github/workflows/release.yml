name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # csc.exe ships with Windows itself, so there is no SDK to set up.
      - name: Compile
        shell: cmd
        run: >
          "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          /nologo /target:winexe /out:PowerTray.exe
          /win32icon:PowerTray.ico
          /win32manifest:PowerTray.manifest
          /reference:System.dll,System.Windows.Forms.dll,System.Drawing.dll
          *.cs

      - name: Verify output
        shell: powershell
        run: |
          if (-not (Test-Path PowerTray.exe)) { throw "PowerTray.exe was not produced" }
          $f = Get-Item PowerTray.exe
          Write-Host ("Built {0} bytes, version {1}" -f $f.Length, $f.VersionInfo.FileVersion)

      # gh is preinstalled on GitHub runners, so no third-party action is needed.
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME

          # Re-pushing a tag should reproduce the release cleanly rather than failing
          # on "already exists", so clear anything already sitting on this tag first.
          gh release delete $tag --yes 2>&1 | Out-Null
          $global:LASTEXITCODE = 0

          $hash = (Get-FileHash PowerTray.exe -Algorithm SHA256).Hash
          $notes = "Download ``PowerTray.exe`` below and run it. No installer, no dependencies.`n`n" +
                   "Built from ``$env:GITHUB_SHA`` by GitHub Actions.`n`n" +
                   "SHA256: ``$hash``"
          # --latest is what points /releases/latest/download/... at this build,
          # which is the link the README download button uses.
          gh release create $tag PowerTray.exe --title "PowerTray $tag" --notes $notes --latest
